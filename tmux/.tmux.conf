#
# System
#

# Terminal config
set -g default-terminal "screen-256color"
set -s terminal-overrides ',screen*:Tc:Ss=\E[%p1%d :Se=\E[ :sitm=\E[3m:ritm=\E[23m'
# Enable mouse
set -g mouse on
# Allow some command to use alternative terminal mode
set -g alternate-screen on
# Disable escape timeout
set -g escape-time 0
# Enable focus events
set -g focus-events on

#
# UI
#
# Disable window auto renaming
set -g allow-rename off
set -g status-style "bg=default,nohidden"
set -g message-style "bg=default,nohidden"
set -g message-command-style "bg=default,nohidden"
set -g mode-style "bg=default,reverse,fg=default,reverse"
set -g copy-mode-match-style "bg=default,reverse,fg=default,reverse"
set -g copy-mode-selection-style "bg=default,reverse,fg=default,reverse"
# Disable left status bar
set -g status-left ''
# Status placeholders
# Session badge or name
set -g status-right '#[fg=default,default] #{?@session_badge,#{@session_badge},#S}'
# Formatted window panes counter template
set -g @window_panes_template '#{?#{>:#{window_panes},1},-(#{window_panes}),}'
# Inactive window
set -wg window-status-format '#[none,dim]#W#{E:@window_panes_template}'
set -wg window-status-current-format '#[none,bold]#W#{E:@window_panes_template}'
# set -g pane-border-format "#{?pane_active,[#{pane_index}],#[default]}"
set -g pane-border-lines simple
set -g pane-border-style "fg=colour7"
set -g pane-active-border-style "fg=default"
set -g pane-border-status off
# Refresh status bar every 3 sec
set -g status-interval 3

#
# Events
#

#
# Key map
#

# General
#
# <Alt>-t as a prefix
set -g prefix M-t
# Render command prompt above status bar
unbind-key :
bind-key : command-prompt -P

# Copy mode
#
# Vi keymap in copy mode
set -g mode-keys vi
# Vim-like leader mode with Space
bind-key -r Space switch-client -T leader-mode
# Start copy mode and select a word on double click
bind-key -n DoubleClick1Pane if-shell -F "#{mouse_any_flag}" "send-keys -M" "copy-mode -M \; send-keys -X select-word"
# Send {Up,Down} keys on Wheel{Up,Down} for panes that doesn't support mouse and in alternative mode
bind-key -n WheelUpPane if-shell -F -t= "#{mouse_any_flag}" "send-keys -M" "send-keys -N 5 Up"
bind-key -n WheelDownPane if-shell -F -t= "#{mouse_any_flag}" "send-keys -M" "send-keys -N 5 Down"
# Display popup window if available
if-shell "test -n '$(tmux list-commands display-popup)'" "bind-key -r -T leader-mode p display-popup -E -w 80% -h 80%"
# Highlight current pane
bind-key -r -T leader-mode h run-shell "bash -ic txhp"
# Persistent mouse selection
unbind-key -T copy-mode-vi MouseDragEnd1Pane
# Clear selection on mouse down
bind-key -T copy-mode-vi MouseDown1Pane send-keys -X cancel-selection
# Vi-like visual selection and yanking in copy mode
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'V' send -X select-line
bind-key -T copy-mode-vi 'r' send -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send -X copy-pipe "copy" \; display-message "copied"
# Enter copy mode and jump to start of a last command
bind-key u copy-mode\; send-keys -F -t:= -X search-backward "^#{@PS1}"

# Panes
#
# (curret pane path is used as a starting directory for new pane)
bind-key -r | split-window -h -c "#{?@cwd,#{@cwd},#{pane_current_path}}"
bind-key -r - split-window -v -c "#{?@cwd,#{@cwd},#{pane_current_path}}"
unbind-key %
unbind-key '"'
# bind-key -r a select-pane -t .+1 ;  resize-pane -Z
# Pane movement
bind-key k select-pane -U
bind-key j select-pane -D
bind-key h select-pane -L
bind-key l select-pane -R
